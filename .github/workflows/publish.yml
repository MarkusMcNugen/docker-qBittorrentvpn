name: Publish

on:
  schedule:
    - cron: "17 6 * * *" # daily: publish when qBittorrent or libtorrent has a new release
    - cron: "43 3 * * 0" # weekly: rebuild for Alpine security updates
  workflow_dispatch:
    inputs:
      force:
        description: Build and publish even when the versions are unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.compare.outputs.build }}
      qbittorrent: ${{ steps.versions.outputs.QBITTORRENT_VERSION }}
      libtorrent: ${{ steps.versions.outputs.LIBTORRENT_VERSION }}
      image_version: ${{ steps.versions.outputs.IMAGE_VERSION }}
      ghcr: ${{ steps.names.outputs.ghcr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image names
        id: names
        run: echo "ghcr=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/qbittorrentvpn" >> "$GITHUB_OUTPUT"
      - name: Resolve versions
        id: versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash build/resolve-versions.sh | tee -a "$GITHUB_OUTPUT"
          echo "IMAGE_VERSION=$(tr -d '[:space:]' < VERSION)" | tee -a "$GITHUB_OUTPUT"
      - name: Compare with the published image
        id: compare
        env:
          GHCR: ${{ steps.names.outputs.ghcr }}
          QBT: ${{ steps.versions.outputs.QBITTORRENT_VERSION }}
          LT: ${{ steps.versions.outputs.LIBTORRENT_VERSION }}
          IMG: ${{ steps.versions.outputs.IMAGE_VERSION }}
          FORCE: ${{ inputs.force }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          want="${QBT} ${LT} ${IMG}"
          if ! have=$(docker buildx imagetools inspect "${GHCR}:latest" \
            --format '{{ with (index .Image "linux/amd64") }}{{ index .Config.Labels "io.github.markusmcnugen.qbittorrent.version" }} {{ index .Config.Labels "io.github.markusmcnugen.libtorrent.version" }} {{ index .Config.Labels "org.opencontainers.image.version" }}{{ end }}' 2>"$RUNNER_TEMP/inspect.err"); then
            echo "no published image to compare with: $(cat "$RUNNER_TEMP/inspect.err")"
            have=none
          fi
          echo "published: ${have}; wanted: ${want}"
          if [ "$FORCE" = true ] || [ "$SCHEDULE" = "43 3 * * 0" ] || [ "$have" != "$want" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    environment: DockerHub
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build arguments
        id: args
        run: |
          {
            echo "args<<EOF"
            echo "QBITTORRENT_VERSION=${{ needs.check.outputs.qbittorrent }}"
            echo "LIBTORRENT_VERSION=${{ needs.check.outputs.libtorrent }}"
            bash build/resolve-qt.sh
            echo "IMAGE_VERSION=${{ needs.check.outputs.image_version }}"
            echo "IMAGE_REVISION=${GITHUB_SHA}"
            echo "IMAGE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: qbittorrentvpn:candidate
          build-args: ${{ steps.args.outputs.args }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=publish-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.arch }}
      - name: Unit tests
        run: bash tests/run.sh unit qbittorrentvpn:candidate
      - name: End-to-end tunnel and leak tests
        run: bash tests/run.sh e2e qbittorrentvpn:candidate
      - name: Registries
        id: registries
        env:
          GHCR: ${{ needs.check.outputs.ghcr }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$HUB_USER" ]; then
            echo "names=${GHCR},docker.io/markusmcnugen/qbittorrentvpn" >> "$GITHUB_OUTPUT"
            echo "hub=true" >> "$GITHUB_OUTPUT"
          else
            echo "names=${GHCR}" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME is not set; publishing to GHCR only"
          fi
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.registries.outputs.hub == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ steps.args.outputs.args }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=publish-${{ matrix.arch }}
          outputs: type=image,"name=${{ steps.registries.outputs.names }}",push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
      - name: Record digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [check, build]
    runs-on: ubuntu-24.04
    environment: DockerHub
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: hub
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: if [ -n "$HUB_USER" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create the multi-architecture tags
        id: manifest
        env:
          GHCR: ${{ needs.check.outputs.ghcr }}
          QBT: ${{ needs.check.outputs.qbittorrent }}
          LT: ${{ needs.check.outputs.libtorrent }}
          IMG: ${{ needs.check.outputs.image_version }}
          HUB: ${{ steps.hub.outputs.enabled }}
        working-directory: /tmp/digests
        run: |
          repos=("$GHCR")
          if [ "$HUB" = true ]; then repos+=(docker.io/markusmcnugen/qbittorrentvpn); fi
          for repo in "${repos[@]}"; do
            tags=(-t "${repo}:latest" -t "${repo}:${QBT}" -t "${repo}:${QBT%.*}" -t "${repo}:${QBT}-lt${LT}" -t "${repo}:v${IMG}")
            # shellcheck disable=SC2046
            docker buildx imagetools create "${tags[@]}" $(printf "${repo}@sha256:%s " *)
            docker buildx imagetools inspect "${repo}:latest"
          done
          echo "digest=$(docker buildx imagetools inspect "${GHCR}:latest" --format '{{ .Manifest.Digest }}')" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.check.outputs.ghcr }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      # A new version, one whose tag does not exist yet, gets a GitHub release
      # on the built commit with its CHANGELOG.md section as notes. Rebuilds
      # of a released version make none.
      - name: GitHub release for a new version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR: ${{ needs.check.outputs.ghcr }}
          IMG: ${{ needs.check.outputs.image_version }}
          HUB: ${{ steps.hub.outputs.enabled }}
        run: |
          tag="v${IMG}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} exists; no new release"
            exit 0
          fi
          awk -v v="$IMG" 'index($0, "## [" v "]") == 1 { f = 1; next } f && /^## \[/ { exit } f && !body && /^[[:space:]]*$/ { next } f { body = 1; print }' \
            CHANGELOG.md >"$RUNNER_TEMP/changes.md"
          if [ ! -s "$RUNNER_TEMP/changes.md" ]; then
            echo "::error::CHANGELOG.md has no section for ${IMG}; add one before releasing it"
            exit 1
          fi
          {
            printf 'Images for linux/amd64 and linux/arm64:\n\n```\n'
            if [ "$HUB" = true ]; then printf 'docker pull markusmcnugen/qbittorrentvpn:%s\n' "$tag"; fi
            printf 'docker pull %s:%s\n' "$GHCR" "$tag"
            printf '```\n\n'
            cat "$RUNNER_TEMP/changes.md"
          } >"$RUNNER_TEMP/notes.md"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
